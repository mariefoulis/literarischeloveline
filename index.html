
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deine Stimme zählt</title>

  <style>
    body {
      margin: 0;
      padding: 50px 20px;
      background: #f5f3ef;
      color: #242424;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 420px;
      margin: auto;
    }

    h1 {
      font-size: 34px;
      font-weight: 500;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 25px;
      font-size: 16px;
      cursor: pointer;
    }

    #mic {
      width: 110px;
      height: 110px;
      margin: 30px auto 15px;
      border-radius: 50%;
      background: #242424;
      color: white;
      font-size: 42px;
      touch-action: manipulation;
    }

    #mic.recording {
      background: #b64a42;
    }

    #timer {
      font-size: 20px;
      margin: 15px 0;
    }

    #status {
      font-size: 14px;
      min-height: 45px;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    #reset {
      margin-top: 20px;
      background: #e4e0d9;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
<main>
  <h1>Deine Stimme zählt.</h1>

  <p>
    Hinterlasse eine Sprachnachricht
    für unser Kunstprojekt.<br>
    Du hast bis zu fünf Minuten Zeit.
  </p>

  <button id="mic" type="button">🎙</button>

  <div id="timer">00:00 / 05:00</div>

  <p id="status">
    Tippe auf das Mikrofon, um zu starten.
  </p>

  <audio id="player" controls hidden></audio>

  <div>
    <button id="reset" hidden>
      Neu aufnehmen
    </button>
  </div>
</main>

<script>
  const mic = document.getElementById('mic');
  const timer = document.getElementById('timer');
  const statusText = document.getElementById('status');
  const player = document.getElementById('player');
  const reset = document.getElementById('reset');

  let recorder;
  let stream;
  let chunks = [];
  let recording = false;
  let startedAt;
  let interval;
  let timeout;
  let audioUrl;

  function formatTime(seconds) {
    const s = Math.floor(seconds);

    return String(Math.floor(s / 60)).padStart(2, '0')
      + ':' + String(s % 60).padStart(2, '0');
  }

  async function startRecording() {
    try {
      if (!navigator.mediaDevices?.getUserMedia ||
          !window.MediaRecorder) {
        throw new Error(
          'Dieser Browser unterstützt keine Audioaufnahme.'
        );
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: true
      });

      chunks = [];

      recorder = new MediaRecorder(stream);

      recorder.ondataavailable = event => {
        if (event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      recorder.onstop = () => {
        clearInterval(interval);
        clearTimeout(timeout);

        stream.getTracks().forEach(track => track.stop());

        const blob = new Blob(chunks, {
          type: recorder.mimeType
        });

        if (audioUrl) {
          URL.revokeObjectURL(audioUrl);
        }

        audioUrl = URL.createObjectURL(blob);

        player.src = audioUrl;
        player.hidden = false;
        reset.hidden = false;

        statusText.textContent =
          'Aufnahme fertig! Du kannst sie anhören.';
      };

      recorder.start();

      startedAt = Date.now();
      recording = true;

      mic.classList.add('recording');
      mic.textContent = '■';

      statusText.textContent =
        'Aufnahme läuft. Tippe zum Stoppen.';

      interval = setInterval(() => {
        const seconds = Math.min(
          300,
          (Date.now() - startedAt) / 1000
        );

        timer.textContent =
          formatTime(seconds) + ' / 05:00';
      }, 200);

      timeout = setTimeout(stopRecording, 300000);

    } catch (error) {
      statusText.textContent =
        'Fehler: ' + error.message;

      console.error(error);
    }
  }

  function stopRecording() {
    if (!recording) return;

    recording = false;

    recorder.stop();

    mic.classList.remove('recording');
    mic.textContent = '🎙';
  }

  mic.addEventListener('click', () => {
    if (recording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  reset.addEventListener('click', () => {
    if (audioUrl) {
      URL.revokeObjectURL(audioUrl);
    }

    player.pause();
    player.removeAttribute('src');
    player.hidden = true;
    reset.hidden = true;

    timer.textContent = '00:00 / 05:00';

    statusText.textContent =
      'Tippe auf das Mikrofon, um neu aufzunehmen.';
  });
</script>
  
<hr style="margin-top:40px">

<button id="connectionTest" type="button">
  Verbindung zu Google testen
</button>

<p id="connectionResult"></p>

<iframe
  name="googleTestFrame"
  id="googleTestFrame"
  style="display:none">
</iframe>

<form
  id="googleTestForm"
  action="https://script.google.com/macros/s/AKfycbwpz5RC7C_LFiH3TJRbKnrHorQp8IevXJP3NFVF3ojr80GJNa7vK6JmptIDXv2zNKRT/exec"
  method="POST"
  target="googleTestFrame"
  style="display:none">

  <input
    type="hidden"
    name="test"
    value="stimmenarchiv-test">
</form>

<script>
  const testButton =
    document.getElementById('connectionTest');

  const testResult =
    document.getElementById('connectionResult');

  const testForm =
    document.getElementById('googleTestForm');

  const testFrame =
    document.getElementById('googleTestFrame');

  let testStarted = false;

  testButton.addEventListener('click', () => {
    testStarted = true;

    testResult.textContent =
      'Testanfrage wird gesendet …';

    testForm.submit();
  });

  testFrame.addEventListener('load', () => {
    if (!testStarted) return;

    testResult.textContent =
      'Die Anfrage wurde abgeschickt. ' +
      'Ob Google sie verarbeitet hat, ' +
      'prüfen wir im Apps-Script-Protokoll.';
  });
</script>

<hr style="margin:40px 0 25px">

<section style="max-width:420px;margin:auto">
  <h2>Aufnahme einsenden</h2>

  <p>
    Dies ist zunächst ein technischer Test.
    Bitte keine persönlichen oder
    vertraulichen Inhalte aufnehmen.
  </p>

  <label style="display:block;margin:20px 0">
    <input type="checkbox" id="testConsent">
    Ich stimme der Speicherung meiner
    Testaufnahme im Projektarchiv zu.
  </label>

  <button id="uploadAudio" type="button" disabled>
    Testaufnahme absenden
  </button>

  <p id="uploadStatus" role="status"></p>
</section>

<iframe
  name="audioUploadFrame"
  id="audioUploadFrame"
  style="display:none">
</iframe>

<form
  id="audioUploadForm"
  action="https://script.google.com/macros/s/AKfycbwpz5RC7C_LFiH3TJRbKnrHorQp8IevXJP3NFVF3ojr80GJNa7vK6JmptIDXv2zNKRT/exec"
  method="POST"
  target="audioUploadFrame"
  style="display:none">

  <input type="hidden" name="audioBase64">
  <input type="hidden" name="mimeType">
  <input type="hidden" name="duration">
  <input type="hidden" name="name" value="">
  <input type="hidden" name="email" value="">
  <input type="hidden" name="artConsent" value="true">
  <input type="hidden" name="contactConsent" value="false">
  <input type="hidden" name="updatesConsent" value="false">
</form>

<script>
  const uploadButton =
    document.getElementById('uploadAudio');

  const uploadStatus =
    document.getElementById('uploadStatus');

  const testConsent =
    document.getElementById('testConsent');

  const uploadForm =
    document.getElementById('audioUploadForm');

  let uploadBusy = false;

  function updateUploadButton() {
    uploadButton.disabled =
      uploadBusy ||
      recording ||
      !testConsent.checked ||
      !recorder ||
      !chunks.length ||
      recorder.state !== 'inactive';
  }

  testConsent.addEventListener(
    'change',
    updateUploadButton
  );

  // Aufnahmestatus regelmäßig prüfen
  setInterval(updateUploadButton, 300);

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        resolve(
          String(reader.result).split(',')[1]
        );
      };

      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  uploadButton.addEventListener(
    'click',
    async () => {
      if (uploadButton.disabled) return;

      uploadBusy = true;
      updateUploadButton();

      try {
        const blob = new Blob(chunks, {
          type: recorder.mimeType
        });

        // Nur kleine Dateien für diesen Test
        if (blob.size > 1024 * 1024) {
          throw new Error(
            'Für diesen Test bitte nur ' +
            'eine kurze Aufnahme machen.'
          );
        }

        const mimeType =
          blob.type.split(';')[0];

        if (![
          'audio/webm',
          'audio/mp4',
          'audio/ogg'
        ].includes(mimeType)) {
          throw new Error(
            'Audioformat nicht unterstützt: ' +
            mimeType
          );
        }

        const base64 =
          await blobToBase64(blob);

        const durationSeconds =
          Math.min(
            300,
            (Date.now() - startedAt) / 1000
          );

        uploadForm.elements[
          'audioBase64'
        ].value = base64;

        uploadForm.elements[
          'mimeType'
        ].value = mimeType;

        uploadForm.elements[
          'duration'
        ].value = String(durationSeconds);

        uploadStatus.textContent =
          'Anfrage wird an Google gesendet. ' +
          'Bitte anschließend Drive und ' +
          'Sheets kontrollieren.';

        uploadForm.submit();

      } catch (error) {
        uploadStatus.textContent =
          'Fehler: ' + error.message;

      } finally {
        uploadBusy = false;
        updateUploadButton();
      }
    }
  );
</script>

</body>
</html>
